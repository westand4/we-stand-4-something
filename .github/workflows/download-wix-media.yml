name: Copy images from Wix

# Downloads every image and document the site still loads from Wix into public/media/,
# records them in src/data/wix-media.json, and commits the result. Safe to run again:
# files already copied are skipped. Run it from the Actions tab, or it runs by itself
# when this workflow or its script changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/download-wix-media.yml
      - scripts/download-wix-media.mjs

permissions:
  contents: write

concurrency:
  group: wix-media
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site to find the Wix links
        run: npx astro build
      - name: Download them
        run: node scripts/download-wix-media.mjs dist
      - name: Commit the copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media src/data/wix-media.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Copy images and documents from Wix into the site"
            git push
          fi
